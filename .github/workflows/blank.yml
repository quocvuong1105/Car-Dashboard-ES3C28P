
name: Build LCDWiki ES3C28P Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.1

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@9.6.0"
          arduino-cli lib install LovyanGFX

      - name: Compile firmware
        run: |
          mkdir -p firmware-output
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=default_16MB" \
            --output-dir firmware-output \
            CarCYD-ES3C28P

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: CarCYD-ES3C28P-firmware
          path: firmware-output/*
          retention-days: 30
