name: Build LCDWiki ES3C28P firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        run: arduino-cli core install esp32:esp32@3.2.1

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@9.6.0"
          arduino-cli lib install LovyanGFX

      - name: Compile LCDWiki ES3C28P sketch
        run: |
          mkdir -p firmware-output
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --warnings all \
            --output-dir "$GITHUB_WORKSPACE/firmware-output" \
            CarCYD-ES3C28P

      - name: List generated files
        if: always()
        run: find firmware-output -maxdepth 2 -type f -printf '%f %s bytes\\n' || true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-output
          path: firmware-output/*
          if-no-files-found: error
          retention-days: 30
