name: Crowdin localization

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Synchronize translations
        uses: crowdin/github-action@v2
        with:
          config: Car-Dashboard-ES3C28P/crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin
          pull_request_base_branch_name: main
          create_pull_request: true
          pull_request_title: "chore(i18n): update Crowdin translations"
          pull_request_body: "Automated translation update from Crowdin. Generated firmware catalogs are validated by CI."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
